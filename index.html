/*-- Modes --*/
* { box-sizing: border-box; }
body { 
    margin: 0;
    font-family : Sans-serif;
    background-color: #121212;
    color: #ffffff;
    line-height: 1.6
}
body.light{
    background: #fbfaf8;

}
a { color: inherit; text-decoration: none; }
h1, h2, h3 { margin: 0 0 10px 0; }
p { margin: 0 0 12px 0; }
ul { margin: 0 0 12px 0; padding-left: 20px; }

.wrap {
  max-width: 780px;
  margin: 0 auto;
  padding: 0 24px;
}

nav {
  position: sticky;
  top: 0;
  background: #0c0d10;
  border-bottom: 1px solid #262a33;
  padding: 14px 0;
  z-index: 10;
}
    
body.light nav {background: #fbfaf8; border-color: #e2ded6; }

.nav-inner{
    max-width: 780px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 10px;
}
.brand { font-weight: 700; margin-right: auto; }
.nav-inner a.nav-link {
  padding: 6px 12px;
  border-radius: 20px;
  color: #a0a7b4;
  font-size: 0.9rem;
}
body.light .nav-inner a.nav-link { color: #5a6069; }
.nav-inner a.nav-link:hover,
.nav-inner a.nav-link.active {
  background: #1c1f27;
  color: #e8eaf0;
}
body.light .nav-inner a.nav-link:hover,
body.light .nav-inner a.nav-link.active {
  background: #f4f2ee;
  color: #17181c;
}
#theme-toggle {
  background: none;
  border: 1px solid #262a33;
  color: #a0a7b4;
  border-radius: 50%;
  width: 34px;
  height: 34px;
  cursor: pointer;
}
body.light #theme-toggle { border-color: #e2ded6; color: #5a6069; }

/*-- Button --*/
.btn{
  display: inline-block;
  padding: 10px 18px;
  border: 1px solid #262a33;
  border-radius: 20px;
  background: #16181e;
  color: #e8eaf0;
  cursor: pointer;
  font-size: 0.9rem;
  margin-right: 6px;
  margin-bottom: 6px;
}

body.light .btn { background: #ffffff; border-color: #e2ded6; color: #17181c; }

}

.hero { padding: 60px 0 40px; }

body.light .hero .lead { color: #5a6069; }

.eyebrow {
  display: inline-block;
  padding: 5px 12px;
  border: 1px solid #262a33;
  border-radius: 20px;
  font-size: 0.8rem;
  color: #a0a7b4;
  margin-bottom: 20px;
}
body.light .eyebrow { border-color: #e2ded6; color: #5a6069; }


section { padding: 30px 0; }
.sec-head {

.post-list { border-top: 1px solid #262a33; }

.post-tag {

  font-size: 0.75rem;
  color: #6e7684;

}
body.light .post-tag { border-color: #e2ded6; }

/* ---------- Article / prose ---------- */
.article-head {

}
body.light .article-head { border-color: #e2ded6; }

.prose p, .prose li { color: #a0a7b4; }

/* ---------- Footer ---------- */
footer {

body.light footer { border-color: #e2ded6; }
.foot-inner {

  justify-content: space-between;

.socials a { margin-left: 12px; color: #a0a7b4; }

/* ---------- Mobile ---------- */
@media (max-width: 620px) {

var POSTS = [
  {
    slug: "dungeon-crawler-progress",
    title: " Dungeon Crawler Progress update",
    date: "2026-09-07",
    tag: "devlog",
    summary: "Inventory system, FOV, dungeon generation and attack animations.",
    body: "<p>As my first shipping, I decided to take the foundation of 'Class Game' and turn it into a dungeon crawler. Four features added this week: camera offset for field of view, an inventory bag UI backed by JSON, attack animations, and procedural dungeon generation with BFS.</p>" +
          "<h2>Field of view</h2>" +
          "<p>I created the function <strong>fov_tiles</strong> - where every tile within the visible FOV radius of 8 tiles relative to the player's (x, y) position is added to the set visible.</p>" +
          "<pre><code>px, py = player_tile\n    for x in range(px - radius, px + radius + 1):\n    for y in range (py - radius, py + radius + 1):\n    if not dungeon.in_bounds(x, y):\n    continue</code></pre>" +
          "<p> With the addition of a <strong>camera_offset</strong> function that centers the player tile to the center of the screen, you can achieve a result where dungeon tiles are only drawn within the FOV radius at the center of the screen.</p>" +
          "<pre><code>visible = fov_tiles(dungeon, player_tile)\n offset_x, offset_y = camera_offset(player_tile, tile_px)\n #draw dungeon tiles\n    pygame.draw.rect(screen, TILE_COLORS[dungeon.tiles[x][y]], rect)</code></pre>" +
          "<h2>Inventory JSON</h2>" +
          "<p>A separate JSON dictionary file was created to store the name, effects, and quantity of an item. Currently, that item is only a health potion, but I plan to add more soon. The little bag icon I made on Piskel, Here's what it looks like.</p>" +
          "<img src=\"Inventory_bag.png\" alt=\"Inventory UI Preview\" style=\"max-width: 100%; height: auto;\">" +
          "<blockquote>The little bag icon toggles between open and closed every time the player presses the 'E' Key</blockquote>" +
          "<h2>Sword and Eye attack animations</h2>" +
          "<p>Using Piskel again, I created GIF animations for the Sword Character and Eye enemy. frames are iterated <code>self.current_frame += 1</code> every time the player or enemy attacks</p>" +
          "<img src=\"SwordAnim.gif\" alt=\"Inventory UI Preview\" style=\"max-width: 100%; height: auto;\">" +
          "<p>I added a 1-second interval between player attacks to allow animations to play out</p>" +
          "<video src=\"attack_anim.mp4\" autoplay loop muted playsinline style=\"max-width: 100%; height: auto;\"></video>" +
          "<h2>Procedural Dungeon Generation</h2>" +
          "<p>I had Claude explain the entire concept by generating an interactive py.file that lets me toggle the layout of a bare-bones dungeon for my personal learning. I took that foundation and brought it to the main game file, <strong>heres what it looks like</strong>.</p>" +
          "<video src=\"Exploration.mp4\" autoplay loop muted playsinline style=\"max-width: 100%; height: auto;\"></video>" +
          "<h2>Whats Next</h2>" +
          "<p>Leveling system and true permadeath; I might introduce a boss enemy and create new animations. Though visual elements are not a top priority right now.</p>"
  },
  {
    slug: "turn-based-class-battle",
    title: " Final Programming Project of High School",
    date: "2026-06-20",
    tag: "devlog",
    summary: "Turn-based Class Battle Game.",
    body: "<p>Before this project, every other project I've done was done lightheartedly. You may have noticed with my John Wick-themed Hangman game; to be honest, I've made a few other games with <strong>questionable</strong> themes... But this one breaks that convention.</p>" +
          "<h2>Picking a Class</h2>" +
          "<p>This game takes inspiration from a recent release from Roblox, called 'An Average Campaign', a roguelike adventure game that featured light-hearted references, campaigns (as the name suggests), encounters, and classes. I took it upon myself to try to replicate similar battle mechanics and class systems, and here's what I learnt.</p>" +
          "<ul><li>Creating unique classes with unique skill sets</li><li>Card selection screen where the player can choose a class orderly drawn on screen</li><li>Simple turn-based battle mechanics and a stats screen</li><li>The Final project was graded 97/100 by my programming teacher :) </li></ul>" +
          "<h2>Takeaway</h2>" +
          "<p>This post clearly wasn't written three months ago, but I'd like to call this my break-out project because it's the foundation of the game I'm planning on publishing this Fall.</p>"
  },
  {
    slug: "blender-rush",
    title: " Learning Blender and Unity in 10 School days---",
    date: "2026-06-17",
    tag: "notes",
    summary: "Rigging, weight-painting, clothing, hair, inverse kinematics, run-cycle animation, applying FBX and animations in Unity.",
    body: "<p>Although I've had prior experience in 3D modeling with Unity, this was one of the biggest sprints I've ever done on the tool alongside Unity.</p>" +
          "<p>This sprint was for the final project of my Game Design 12 Class - a Unique class offered by my High School. <strong>For that project, I only had four objectives.</strong></p>" +
          "<ul><li>Learn how to make a piece of clothing or accessory and attach it to the rig of your pre-made mesh - I chose a scarf.</li><li>Learn to animate something - I chose a Run Cycle.</li><li>Learn to export your character FBX and make your run animation work in Unity.</li><li>Learning and apply cloth physics in blender.</li></ul>" +
          "<h2>Under what circumstance?</h2>" +
          "<p>We were given roughly <strong>two school weeks, at most 12 school days - 70 minutes a day</strong>, to complete our respective final passion projects. Given I had such a strong passion for game dev (I know :D ), I tasked myself with learning everything above within that time frame and preparing a final product to present. The troubling factor was that <strong>I had to do everything on the school computer.</strong></p>" +
          "<h2>The Result</h2>" +
          "<p>In just ten school days, I learnt and compiled everything into a presentable result. Everything but <strong>cloth physics</strong>, though I was very close. <strong>Below are some videos and screenshots to show my results</strong></p>" +
          "<h3>The Rig</h3>" +
          "<img src=\"Rig.png\" alt=\"Character Rig in Blender\" style=\"max-width: 100%; height: auto;\">" +
          "<h3>Run Cycle</h3>" +
          "<p><strong>Yes</strong>, it is the Naruto Run, which saved me some time from animating the arms to meet the deadline; every limb joint has Inverse Kinematics</p>" +
          "<img src=\"run-cycle.png\" alt=\"Run Cycle Keyframes\" style=\"max-width: 100%; height: auto;\">" +
          "<h3>Unity application</h3>" +

          "<li><a href=\"https://www.youtube.com/watch?v=qxoo_bcUZos\">Run Cycle Tutorial</a></li>" +
          "</ul>"
  }
];

function formatDate(iso) {
  var d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-CA", { year: "numeric", month: "short", day: "numeric" });
}

function sortPosts() {
  return POSTS.slice().sort(function (a, b) {
    return b.date.localeCompare(a.date);
  });
}

function postRow(p) {
  return '<a class="post-row" href="#/logs/' + p.slug + '">' +
           '<span class="post-date">' + formatDate(p.date) + '</span>' +
           '<span>' +
             '<span class="post-title">' + p.title + '</span>' +
             '<span class="post-sub">' + p.summary + '</span>' +
           '</span>' +
           '<span class="post-tag">' + p.tag + '</span>' +
         '</a>';
}

/* -- VIEWS and UI -- */

function viewHome() {
  var latest = sortPosts().slice(0, 3);

  var projectHTML = "";
  PROJECTS.forEach(function (p) {
    var tagHTML = "";

  });

    var items = "";

  });

  var postsHTML = "";
  latest.forEach(function (p) { postsHTML += postRow(p); });

  return '<div class="wrap">' +
    '<header class="hero">' +
      '<span class="eyebrow">Open to internships · Summer 2027</span>' +
      '<h1>Arren Kuk</h1>' +
      '<p class="lead">' + PROFILE.roles + '. I\'m ' + PROFILE.name.split(" ")[0] + ", a SWE co-op Freshman at McGill and a solo Game Dev on the side. I'm interested in and enjoy building experiences that can make others' day easier and a bit more engaging.</p>" +
      '<div>' +
        '<a class="btn btn-primary" href="#/logs">Read the dev logs →</a>' +
        '<br><a class="btn" href="' + PROFILE.resume + '" target="_blank">Résumé →</a>' +
        '<br><a class="btn" href="' + PROFILE.github + '" target="_blank">GitHub →</a>' +
      '</div>' +
    '</header>' +
    '<hr>' +
    '<section>' +
      '<div class="sec-head"><h2>Selected Projects</h2></div>' +
      '<div>' + projectHTML + '</div>' +
    '</section>' +
    '<section>' +
      '<div class="sec-head"><h2>Recent dev logs</h2><a class="link-more" href="#/logs">View all (' + POSTS.length + ') →</a></div>' +
      '<div class="post-list">' + postsHTML + '</div>' +
    '</section>' +
    '<section>' +
      '<div class="sec-head"><h2>Skills &amp; tools</h2></div>' +
      '<dl class="skills">' + skillHTML + '</dl>' +
    '</section>' +
  '</div>';

function viewLogs() {
  var rows = "";
  sortPosts().forEach(function (p) { rows += postRow(p); });
  return '<div class="wrap">' +
    '<header class="article-head">' +
      '<a class="back" href="#/">← Back to work</a>' +
      '<h1>Dev Logs</h1>' +
      '<p class="post-sub">Short notes on what I\'m building, my past projects, and updates. ' + POSTS.length + ' posts.</p>' +
    '</header>' +
    '<div class="post-list">' + rows + '</div>' +
  '</div>';
}

function viewPost(slug) {
  var all = sortPosts();
  var index = -1;
  for (var i = 0; i < all.length; i++) {
    if (all[i].slug === slug) { index = i; break; }
  }
  if (index === -1) return viewNotFound();

  var p = all[index];
  var older = all[index + 1];
  var newer = all[index - 1];

  var olderHTML = older ? '<a class="btn" href="#/logs/' + older.slug + '">← Older</a>' : '<span></span>';
  var newerHTML = newer ? '<a class="btn" href="#/logs/' + newer.slug + '">Newer →</a>' : '<span></span>';

  return '<div class="wrap">' +
    '<header class="article-head">' +
      '<a class="back" href="#/logs">← All dev logs</a>' +
      '<h1>' + p.title + '</h1>' +
      '<div class="article-meta">' + formatDate(p.date) + ' · ' + p.tag + '</div>' +
    '</header>' +
    '<article class="prose">' + p.body + '</article>' +
    '<div class="article-nav">' + olderHTML + newerHTML + '</div>' +
  '</div>';
}

function viewNotFound() {
  return '<div class="wrap" style="padding:100px 24px;text-align:center">' +
    '<h1 style="font-size:3rem">404</h1>' +
    '<p style="color:#a0a7b4;margin-bottom:26px">That page rolled a critical fail.</p>' +
    '<a class="btn btn-primary" href="#/">Back home →</a>' +
  '</div>';
}

/* ============================================================
   ROUTER
   ============================================================ */

function render() {
  var path = location.hash.replace(/^#/, "") || "/";
  path = path.replace(/\/$/, "") || "/";

  var html = "";
  var title = "";

  if (path === "/") {
    html = viewHome();
    title = PROFILE.name + " · Game Developer";
  } else if (path === "/logs") {
    html = viewLogs();
    title = "Dev Logs · " + PROFILE.name;
  } else if (path.indexOf("/logs/") === 0) {
    var slug = path.slice(6);
    var post = null;
    for (var i = 0; i < POSTS.length; i++) {
      if (POSTS[i].slug === slug) { post = POSTS[i]; break; }
    }
    html = viewPost(slug);
    title = post ? post.title + " · " + PROFILE.name : "Not found";
  } else {
    html = viewNotFound();
    title = "Not found";
  }

  document.getElementById("main").innerHTML = html;
  document.title = title;

  // Highlight active nav link
  var links = document.querySelectorAll(".nav-link");
  for (var j = 0; j < links.length; j++) {
    var route = links[j].getAttribute("data-route");
    var active = (route === "/") ? (path === "/") : (path.indexOf(route) === 0);
    if (active) {
      links[j].classList.add("active");
    } else {
      links[j].classList.remove("active");
    }
  }

  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", render);

/* ============================================================
   THEME TOGGLE
   ============================================================ */

var toggle = document.getElementById("theme-toggle");
var saved = localStorage.getItem("theme");
if (saved === "light") {
  document.body.classList.add("light");
}
toggle.addEventListener("click", function () {
  document.body.classList.toggle("light");
  localStorage.setItem("theme", document.body.classList.contains("light") ? "light" : "dark");
});

/* ============================================================
   GO
   ============================================================ */

render();
</script>
</body>
</html>
